<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- 浏览器标签上显示的网站标题 -->
    <title>LJY2231</title>
    <!-- 网站介绍 -->
    <meta name="description" content="LJY2231的个人网站主页，二次元卡片式风格">
    <!-- 网站关键字 -->
    <meta name="keywords" content="风也温柔,个人主页,程序员">
    <!-- 样式文件 -->
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="./static/style.css?v=1.2.0">

    <!-- 自定义设置 -->
    <style>
        html {
            /* 随机二次元背景图 API（每次刷新换图） */
            background-image: url("https://t.alcy.cc/pc");
        }

        /* 手机端：竖向背景图 */
        @media (max-width: 767px) {
            html {
                background-image: url("https://t.alcy.cc/mp");
            }
        }

        body {
            /* body 透明，让 z-index:-1 的粒子背景显示在背景图之上 */
            background-color: transparent;
            background-image: none;
        }
    </style>
    <script>
        // 一言设置
        let hitokoto_api = "https://v1.hitokoto.cn"; // 一言API
    </script>
    <!-- end 自定义设置 -->
</head>

<body>
    <!-- 图床加载失败提示（左上角，默认隐藏） -->
    <div id="bg-fail-tip">图床加载失败</div>

    <!-- 左上角歌词面板（风格同左下角播放器） -->
    <div id="lyrics-box">
        <button id="lyrics-collapse" title="收起歌词">←</button>
        <div id="lyrics-song"></div>
        <div class="lyrics-list">
            <div class="lyrics-roll">
                <div id="lyrics-p2" class="lyrics-line"></div>
                <div id="lyrics-p1" class="lyrics-line"></div>
                <div id="lyrics-cur" class="lyrics-line current"></div>
                <div id="lyrics-n1" class="lyrics-line"></div>
                <div id="lyrics-n2" class="lyrics-line"></div>
            </div>
        </div>
    </div>

    <!-- 歌词收起后的半圆长筒按钮（左边缘伸出） -->
    <button id="lyrics-reopen" title="展开歌词">♪ 词</button>

    <div id="main" class="container">
        <div class="row my-card justify-content-center">
            <div class="col-lg-8 card">
                <!-- 大标题 -->
                <h1 class="fade-line">LJY2231</h1>
                <!-- 个人简介 -->
                <p class="fade-line" style="animation-delay: 0.8s;">你好！我是 LJY2231，欢迎来到我的网站</p>
                <p id="hitokoto_text" class="fade-line" style="animation-delay: 1.6s;">:D 一言获取中...</p>
                <div class="container-fluid">
                    <div class="row">
                        <!-- 导航按钮组 -->
                        <button data-href="//blog.223100.xyz" data-title="Blog" data-window="newtab"
                            data-area-w="80%" data-area-h="90%" data-shade="false"
                            class="nav-btn btn btn-primary col-lg-4 fade-line" style="animation-delay: 2.4s;">Blog</button>

                        <button data-href="https://github.com/ljy2231/LJYHomePage" data-title="GitHub" data-window="newtab"
                            data-anim="4" data-area-w="80%" data-area-h="90%" data-shade="false"
                            class="nav-btn btn btn-secondary col-lg-4 fade-line" style="animation-delay: 2.4s;">GitHub</button>

                        <button data-href="https://mail.qq.com/cgi-bin/qm_share?t=qm_mailme&email=ljy2231@002230.xyz"
                            data-title="Blog" data-window="pop" data-anim="4" data-area-w="80%" data-area-h="90%"
                            data-shade="false" class="nav-btn btn btn-success col-lg-4 fade-line"
                            style="animation-delay: 2.4s;">Send a Mail</button>

                        <!-- end 导航按钮组 -->
                    </div>
                </div>

                <footer>
                    <p>
                        <span class="fade-line" style="display: block; animation-delay: 3.2s;">
                            <span id="busuanzi_container_site_pv" style="display:none;">本站总访问量 <span
                                    id="busuanzi_value_site_pv"></span> 次</span>
                            <span id="busuanzi_container_site_uv" style="display:none;"> · 访客数 <span
                                    id="busuanzi_value_site_uv"></span> 人</span>
                        </span>
                        <span class="fade-line" style="display: block; animation-delay: 4s;">
                            本站已运行 <span id="run-days">0</span> 天 <span id="run-hours">0</span> 小时 <span
                                id="run-minutes">0</span> 分钟 <span id="run-seconds">0</span> 秒
                        </span>
                        <span class="fade-line" style="display: block; animation-delay: 4.8s;">
                            Copyright 2026
                        </span>
                    </p>
                </footer>
            </div>
        </div>

    </div>

    <!-- 音乐播放器（左下角浮动，需在 transform 容器之外才能 fixed 生效） -->
    <div class="player" id="player">
        <div class="player__head">
            <img class="player__cover" id="player-cover" src="" alt="cover">
            <div class="player__meta">
                <b class="player__song-name" id="player-artist">—</b>
                <span class="player__title" id="player-title">点击下方歌曲播放</span>
            </div>
            <div class="player__btns">
                <button id="btn-prev" title="上一曲">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm12 0l-9 6 9 6z"/></svg>
                </button>
                <button id="btn-play" title="播放/暂停">
                    <svg id="play-ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-ico" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                </button>
                <button id="btn-next" title="下一曲">
                    <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l9 6-9 6z"/></svg>
                </button>
                <button id="player-collapse" title="收起播放器">
                    <svg viewBox="0 0 24 24"><path d="M12 16.5l-8-8h16z"/></svg>
                </button>
            </div>
            <div class="player__bar">
                <span class="player__time" id="player-cur">0:00</span>
                <div class="player__track" id="player-track">
                    <div class="player__fill" id="player-fill"></div>
                </div>
                <span class="player__time" id="player-dur">0:00</span>
            </div>
        </div>
        <ul class="player__playlist" id="player-list"></ul>
    </div>

    <!-- 播放器收起后的展开按钮 -->
    <button id="player-reopen" title="展开播放器">♪</button>

    <!-- 右下角小鲸鱼挂件 -->
    <div id="whale">
        <div id="whale-content">
            <div id="whale-bubble">
                <svg viewBox="0 0 1026 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                    <path class="wb-shape" fill="#FFFFFF" stroke="#203170" stroke-width="18" stroke-linejoin="round"
                        stroke-linecap="round"
                        d="M 827 248 A 373 232 0 1 0 81 246 A 373 232 0 0 0 301 465 A 57 32 10 0 0 413 484 A 373 232 0 0 0 827 248 Z" />
                    <ellipse class="wb-b1" cx="352" cy="561" rx="37.5" ry="26" fill="#FFFFFF" stroke="#203170"
                        stroke-width="18" />
                    <ellipse class="wb-b2" cx="442" cy="646" rx="24.5" ry="18" fill="#FFFFFF" stroke="#203170"
                        stroke-width="18" />
                </svg>
                <div class="wb-text" id="whale-bubble-text"></div>
            </div>
            <img id="whale-img" src="./static/images/whale.png" alt="小鲸鱼">
        </div>
        <div id="whale-menu" title="设置">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2.2H4zM4 10.9h16v2.2H4zM4 15.8h16v2.2H4z"/></svg>
        </div>
        <div id="whale-panel">
            <div class="whale-row">
                <span>大小</span>
                <input type="range" id="wh-scale" min="0.6" max="2.5" step="0.1">
                <span id="wh-scale-num">1.0</span>
            </div>
            <div class="whale-row">
                <span>音效</span>
                <select id="wh-sound">
                    <option value="duck">小黄鸭</option>
                    <option value="fx1">音效1</option>
                    <option value="steel">钢管落地</option>
                </select>
            </div>
            <div class="whale-row">
                <span>音量</span>
                <input type="range" id="wh-vol" min="0" max="1" step="0.05">
                <span id="wh-vol-num">90%</span>
            </div>
            <div class="whale-row">
                <label><input type="checkbox" id="wh-bubble" checked> 气泡</label>
            </div>
            <div class="whale-row">
                <button id="whale-hide" title="隐藏小鲸鱼">隐藏小鲸鱼</button>
            </div>
        </div>
    </div>

    <!-- 隐藏小鲸鱼后的唤出按钮（右下角，简笔鲸鱼图标） -->
    <button id="whale-reopen" title="唤出小鲸鱼">
        <svg viewBox="0 0 24 24"><path d="M4 13c0-2.8 2-4.5 4.8-4.5H10c3.5 0 6.5.4 10-1.2"/><path d="M3.5 16.5c.3-1.2 1-2 2.3-2.3"/><path d="M20 7.3c1.6 1.3 1.6 4.1 0 5.4"/><path d="M14.8 17.2c.4-1.6 1.3-2.7 2.9-3.1"/><path d="M8.8 9.8c1 0 1.8.8 1.8 1.8s-.8 1.8-1.8 1.8"/><circle cx="12.5" cy="11.5" r="6.5"/></svg>
    </button>

    <!-- 右上角设置 -->
    <div id="settings">
        <button id="settings-btn" title="设置">
            <svg viewBox="0 0 24 24"><path d="M19.4 13c.1-.3.1-.7.1-1s0-.7-.1-1l2-1.6c.2-.1.2-.4.1-.6l-1.9-3.3c-.1-.2-.4-.3-.6-.2l-2.4 1c-.5-.4-1.1-.7-1.7-1L14.5 2.8c0-.2-.2-.4-.4-.4h-3.8c-.2 0-.4.2-.4.4l-.4 2.5c-.6.3-1.2.6-1.7 1l-2.4-1c-.2-.1-.5 0-.6.2L2.9 8.9c-.1.2 0 .5.1.6l2 1.6c-.1.3-.1.7-.1 1s0 .7.1 1l-2 1.6c-.2.1-.2.4-.1.6l1.9 3.3c.1.2.4.3.6.2l2.4-1c.5.4 1.1.7 1.7 1l.4 2.5c0 .2.2.4.4.4h3.8c.2 0 .4-.2.4-.4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1c.2.1.5 0 .6-.2l1.9-3.3c.1-.2 0-.5-.1-.6l-2-1.6zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
        <div id="settings-panel">
            <div class="settings-title">设置</div>
            <button id="btn-bg" class="settings-action">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
                更换背景图
            </button>
            <button id="btn-reload-music" class="settings-action">
                <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                重新载入歌曲
            </button>
            <button id="btn-reload-whale" class="settings-action">
                <svg viewBox="0 0 24 24"><path d="M4 13c0-2.8 2-4.5 4.8-4.5H10c3.5 0 6.5.4 10-1.2"/><path d="M3.5 16.5c.3-1.2 1-2 2.3-2.3"/><path d="M20 7.3c1.6 1.3 1.6 4.1 0 5.4"/><path d="M14.8 17.2c.4-1.6 1.3-2.7 2.9-3.1"/><circle cx="12.5" cy="11.5" r="6.5"/></svg>
                重新加载小鲸鱼
            </button>
        </div>
    </div>

    <script src="https://cdn.staticfile.org/jquery/3.2.1/jquery.min.js"></script>
    <script src="./static/layer-v3.5.1/layer/layer.js"></script>

    <!-- 不蒜子访客统计 -->
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

    <script src="./static/main.js"></script>
    <script src="./static/whale.js"></script>

    <!-- canvas-nest 粒子背景（来自 dash.002231.xyz） -->
    <script src="./static/canvas-nest.min.js" zIndex="-1" opacity="0.5" color="0,0,255" count="150"></script>

</html>
